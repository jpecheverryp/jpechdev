name: pipeline
on:
  push:
    branches:
      - "main"

permissions:
  packages: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
     #- name: Install dependencies
       #run: go get .
      - name: Test with the Go CLI
        run: go test ./...

