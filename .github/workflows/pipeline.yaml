name: pipeline
on:
  push:
    branches:
      - "main"

permissions:
  packages: write

jobs:
  commit-hash:
    runs-on: ubuntu-latest
    outputs:
      commit-hash: ${{ steps.get_commit.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v4
      - name: Get commit commit
        id: get_commit
        run: echo "::set-output name=commit_hash::$(git rev-parse HEAD"

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install Templ
        run: go install github.com/a-h/templ/cmd/templ@latest
      - name: Generate Templ Files
        run: templ generate
      - name: Install dependencies
        run: go mod tidy
      - name: Test with the Go CLI
        run: go test ./...

  build-and-push-image:
    runs-on: ubuntu-latest
    needs:
      - commit-hash
      - run-tests
    steps:
      - name: Chechout repository
        uses: actions/checkout@v4
      - name: Set short git commmit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jpecheverryp/jpechdev:latest
            ghcr.io/jpecheverryp/jpechdev:${{ needs.commit-hash.outputs.commit_hash }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - commit-hash
      - build-and-push-image

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Create ENV file
        run: |
          echo "GIT_COMMIT_HASH=${{ github.sha }}" >> env
      - name: 'Docker Stack deploy'
        uses: cssnr/stack-deploy-action@v1
        with:
          name: 'jpechdev'
          file: 'docker-stack.yaml'
          host: jpech.dev
          user: deploy
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          env_file: './env'


